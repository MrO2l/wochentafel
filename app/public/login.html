<!-- AP-Merge (Login/App-Shell-Zusammenfuehrung, Auftrag ANORAK, von ZANDOR sicherheitsarchitektonisch
     geprueft/freigegeben): index.html ist jetzt der alleinige Einstiegspunkt fuer An-/Abmelden,
     Registrieren, Passwort-Wiederherstellung UND die eigentliche App (siehe dortiger Kommentar bei
     #authWrap sowie app.js/wireAuthForms()). Grund: login.html und index.html waren zwei getrennte
     Seitenladevorgaenge/JS-Kontexte, wodurch der modul-lokal im Speicher gehaltene Haushalts-
     Schluessel (crypto.js, householdKeyBytes) beim Navigieren zwischen beiden verloren ging -- das
     erzwang eine stoerende doppelte Passworteingabe (einmal beim Login, ein zweites Mal im
     "Entsperren"-Dialog nach dem Seitenwechsel). Dieser duenne Redirect-Stub bleibt nur fuer alte
     Lesezeichen/externe Links auf login.html bestehen -- login.js ist komplett entfallen, seine
     gesamte Logik lebt jetzt in app.js/index.html als fuenfte, clientseitig (ohne Seitenwechsel)
     umgeschaltete Ansicht.
     Bewusst NUR <meta http-equiv="refresh">, kein <script>: ein inline <script>-Block waere unter
     der bestehenden CSP (server.js, script-src 'self' 'wasm-unsafe-eval', kein 'unsafe-inline')
     ohnehin blockiert; der sichtbare Link darunter ist der Fallback fuer den (raren) Fall, dass ein
     Browser/eine Konfiguration die Meta-Weiterleitung nicht ausfuehrt. -->
<p><a href="index.html">Weiter zu Wochentafel</a></p>
